name: Deploy MkDocs
on:
  push:
    branches:
      - main
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: 3.x
      # Pinned to the Material 9.x line (built on MkDocs 1.x). This keeps the
      # build reproducible and prevents a future auto-jump to a Material/MkDocs
      # 2.0 release that would break this setup. See the MkDocs 2.0 warning:
      # https://squidfunk.github.io/mkdocs-material/blog/2026/02/18/mkdocs-2.0/
      - run: pip install "mkdocs-material==9.*"
      - run: mkdocs gh-deploy --force